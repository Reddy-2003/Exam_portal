{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coding Platform</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      background: #f4f4f9;
    }
    .sidebar {
      width: 80px;
      background: #2c3e50;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }
    .sidebar button {
      background: #34495e;
      border: none;
      color: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      width: 50px;
      height: 50px;
      transition: background 0.3s;
    }
    .sidebar button:hover {
      background: #1abc9c;
    }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px;
    }
    .problem-box, .editor-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow-y: auto;
    }
    .problem-box h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    textarea#editor {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 14px;
      background: #1e1e1e;
      color: #f8f8f2;
      padding: 15px;
      border: none;
      border-radius: 8px;
      resize: none;
    }
    .actions {
      margin-top: 15px;
    }
    .actions button {
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .actions .run {
      background: #3498db;
      color: white;
    }
    .actions .submit {
      background: #2ecc71;
      color: white;
    }
    .output {
      margin-top: 15px;
      padding: 10px;
      background: #ecf0f1;
      border-radius: 5px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
    }
    #score-box {
      margin-top: 10px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button onclick="loadProblem('leap')">1</button>
    <button onclick="loadProblem('nextprime')">2</button>
    <button onclick="loadProblem('hcf')">3</button>
    <button onclick="loadProblem('median')">4</button>
  </div>

  <div class="main">
    <div class="problem-box" id="problem-box">
      <h2>Select a Problem</h2>
      <p>Click a number on the left to load the question.</p>
    </div>

    <div class="editor-box">
      <h2>Python Code Editor</h2>
      <textarea id="editor" placeholder="# Write your Python code here..."></textarea>

      <div class="actions">
        <button class="run" onclick="runCode()">Run</button>
        <button class="submit" onclick="submitCode()">Submit</button>
      </div>

      <div class="output" id="output">Output will appear here...</div>
      <div id="score-box"></div>
    </div>
  </div>

  <script>
    let currentProblem = null;
    let lastResult = "";
    let lastScore = 0;

    const problems = {
      leap: `You are given a year.
Write a program to check whether it is a leap year.

Example:
Input: 2020 → Output: Yes
Input: 1900 → Output: No`,
      nextprime: `You are given an integer N.
Write a program to find the next prime number greater than N.

Example:
Input: 14 → Output: 17
Input: 29 → Output: 31`,
      hcf: `Write a program to find the HCF (Highest Common Factor) of two given numbers.

Example:
Input: 12 18 → Output: 6
Input: 60 48 → Output: 12`,
      median: `You are given two lists of integers.
Write a program to merge them and find the median.

Example:
list1 = [1,3,5], list2 = [2,4,6]
Merged = [1,2,3,4,5,6], Median = 3.5`
    };

    function loadProblem(problem) {
      currentProblem = problem;
      document.getElementById("problem-box").innerHTML = 
        `<h2>Problem</h2><pre>${problems[problem]}</pre>`;
    }

    function runCode() {
      const code = document.getElementById("editor").value;
      if (!currentProblem) {
        alert("Please select a problem first!");
        return;
      }
      fetch("/api/run-code/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ problem: currentProblem, code: code })
      })
      .then(res => res.json())
      .then(data => {
        lastResult = data.result;
        lastScore = data.score;
        document.getElementById("output").textContent = data.result;
        document.getElementById("score-box").innerHTML = 
          `<b>Score (if submitted): ${lastScore}</b>`;
      });
    }

    function submitCode() {
      const code = document.getElementById("editor").value;
      if (!currentProblem) {
        alert("Please select a problem first!");
        return;
      }
      fetch("/api/submit-code/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          problem: currentProblem,
          code: code,
          result: lastResult,
          score: lastScore
        })
      })
      .then(res => res.json())
      .then(data => {
        alert(`${data.message} Marks Awarded: ${data.score}`);
      });
    }
  </script>
</body>
</html>
