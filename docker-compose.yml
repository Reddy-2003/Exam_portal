version: '3.8'

services:
  db:
    image: postgres:15
    container_name: exam_portal_db
    environment:
      POSTGRES_DB: exam_portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vijay123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: exam_portal
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=assignment_platform.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=exam_portal_db
      - DB_USER=postgres
      - DB_PASSWORD=vijay123
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
